<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>RESPAWN · contact sheet</title>
<!-- Every wearable item on body A and body B at all 4 evolution stages, for pixel QA.
     npm start → http://localhost:5173/tools/contact-sheet.html?slot=top   (slot = overview | all | top | bottom | shoes | hair | detail | face | head | hand | back | new) -->
<style>
  body { margin: 0; padding: 16px; background: #0b0b0e; color: #d9d9e0; font: 13px/1.3 system-ui, sans-serif; }
  h1 { font-size: 16px; margin: 0 0 4px; } p { margin: 0 0 14px; color: #8a8a96; }
  table { border-collapse: collapse; } td, th { padding: 2px 4px; text-align: center; vertical-align: middle; }
  th { font-weight: 500; color: #8a8a96; font-size: 11px; letter-spacing: .08em; }
  td.n { text-align: right; padding-right: 12px; white-space: nowrap; max-width: 150px; overflow: hidden; text-overflow: ellipsis; }
  td.n small { display: block; color: #6b6b78; font-size: 10px; }
  .gap { width: 18px; } canvas { image-rendering: pixelated; background: #1a1a20; border-radius: 6px; display: block; }
  tr.sep td { padding-top: 14px; color: #f4f4f5; text-align: left; font-weight: 600; }
</style>
</head>
<body>
<h1 id="h"></h1><p>Кожен рядок — одна річ. Ліворуч фігура A, праворуч фігура B; у кожній 4 стадії еволюції рангу (NPC → Фінальний бос).</p>
<table id="t"></table>
<script type="module">
import { compose, paint, SW, SH } from '../js/sprite.js';
import { ITEMS, DEFAULT_EQ, SLOTS } from '../js/data.js';
const q = new URLSearchParams(location.search), want = q.get('slot') || 'overview', Z = +q.get('z') || 2;
const WEAR = ['top', 'bottom', 'shoes', 'hair', 'detail', 'face', 'head', 'hand', 'back'];
const STAGES = ['NPC', 'Гравець', 'Ветеран', 'Майстер'];
const base = { ...DEFAULT_EQ, face: null };
const OVERVIEW = [
  ['Стартовий вигляд', {}], ['Без верху / спорт-топ', { top: 'shirtless', bottom: 'shorts' }], ['Майка', { top: 'tank', bottom: 'joggers' }],
  ['Худі', { top: 'hoodie' }], ['Костюм', { top: 'suit', bottom: 'suit_pants', shoes: 'boots' }], ['Довге волосся', { hair: 'long', hairColor: 'brown', top: 'turtleneck' }],
  ['Кібер', { top: 'cyber', bottom: 'cyber_legs', shoes: 'kicks_neon' }], ['Золото', { top: 'gold', bottom: 'gold_legs', shoes: 'gold_boots', head: 'crown' }],
];
const cell = look => { const c = document.createElement('canvas'); c.width = SW; c.height = SH; c.style.width = SW * Z + 'px'; c.style.height = SH * Z + 'px'; paint(c.getContext('2d'), compose(look)); const td = document.createElement('td'); td.appendChild(c); return td; };
const t = document.getElementById('t');
const head = document.createElement('tr');
head.innerHTML = `<th></th>${STAGES.map(s => `<th>A · ${s}</th>`).join('')}<th class="gap"></th>${STAGES.map(s => `<th>B · ${s}</th>`).join('')}`;
t.appendChild(head);
function row(label, sub, eq) {
  const tr = document.createElement('tr');
  tr.innerHTML = `<td class="n">${label}${sub ? `<small>${sub}</small>` : ''}</td>`;
  for (const body of ['a', 'b']) {
    for (let build = 0; build < 4; build++) tr.appendChild(cell({ ...base, ...eq, body, build, expr: Math.min(2, build) }));
    if (body === 'a') { const g = document.createElement('td'); g.className = 'gap'; tr.appendChild(g); }
  }
  t.appendChild(tr);
}
const sep = name => { const tr = document.createElement('tr'); tr.className = 'sep'; tr.innerHTML = `<td colspan="10">${name}</td>`; t.appendChild(tr); };
if (want === 'new') { // everything added in 2.0
  document.getElementById('h').textContent = 'Нові речі 2.0';
  const legacy = new Set(JSON.parse(q.get('legacy') || '[]'));
  for (const s of WEAR) { const list = ITEMS.filter(i => i.slot === s && (i.src?.sp || ['bob', 'ponytail', 'braid', 'bun', 'pixie', 'curtain', 'waves', 'space_buns', 'copper', 'ash', 'lavender', 'crop', 'denim', 'skirt', 'mini', 'leggings', 'flare', 'kedy', 'cowboy', 'guitar'].includes(i.key) || s === 'detail')); if (!list.length) continue; sep(SLOTS.find(x => x.id === s)?.name || s); for (const it of list) row(it.name, it.id, { [s]: it.key, ...(s === 'hairColor' ? {} : {}) }); }
}
else if (want === 'overview') { document.getElementById('h').textContent = 'Фігури A і B · огляд'; for (const [n, eq] of OVERVIEW) row(n, '', eq); }
else {
  const slots = want === 'all' ? WEAR : [want];
  document.getElementById('h').textContent = `Фігури A і B · ${slots.map(s => SLOTS.find(x => x.id === s)?.name || s).join(', ')}`;
  for (const s of slots) { if (slots.length > 1) sep(SLOTS.find(x => x.id === s)?.name || s); for (const it of ITEMS.filter(i => i.slot === s)) row(it.name, it.id, { [s]: it.key }); }
}
document.body.dataset.ready = '1';
</script>
</body>
</html>
